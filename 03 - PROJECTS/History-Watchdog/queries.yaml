# =============================================================================
# Venue Filter (Refinery Stage)
# Only retain papers from these venues for quality control
# =============================================================================

venue_filter:
  tier1:
    - "Science"
    - "Cell"
    - "Nature"
    - "Nature Genetics"
    - "PNAS"
    - "Current Biology"
    - "American Journal of Human Genetics (AJHG)"
    - "PLOS Genetics"
  tier2:
    - "Annual Review of Linguistics"
    - "Journal of South Asian Studies"
    - "Indian Economic and Political Weekly (EPW)"
    - "Modern Asian Studies"
    - "Journal of Asian Studies"
    - "Cambridge Archaeological Journal"
  tier3:
    - "arXiv preprint (q-bio.GN, cs.DL)"
    - "bioRxiv"
    - "Google Scholar (if no tier1/2 available)"

