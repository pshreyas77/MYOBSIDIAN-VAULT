# =============================================================================
# Run Configuration
# =============================================================================

run_config:
  schedule: "Monday 02:00 IST weekly"
  max_runtime_minutes: 45
  max_papers_to_scan: 50
  high_quality_papers_to_retain: 5
  tool_timeout_minutes: 10
  output_format: "json"

  # Scite.ai settings
  scite:
    check_support_dispute: true
    min_evidence_count: 2
    flag_if_disputed: true
    flag_if_superseded: true

  # Output paths
  paths:
    raw: "E:/_Knowledge/ObsidianVault/03 - PROJECTS/History-Watchdog/raw/"
    processed: "E:/_Knowledge/ObsidianVault/03 - PROJECTS/History-Watchdog/processed/"
    deltas: "E:/_Knowledge/ObsidianVault/03 - PROJECTS/History-Watchdog/deltas/"
    audit: "E:/_Knowledge/ObsidianVault/03 - PROJECTS/History-Watchdog/audit/"
    automated_sources: "E:/_Knowledge/ObsidianVault/Research/Automated/"